<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self' blob:; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta property="og:title" content="Informe privado · Professional Software">
    <meta property="og:description" content="Acceso privado con contraseña.">
    <title>Informe privado · Professional Software</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../private-reports/gate.css">
    <script type="module" src="../../private-reports/gate.js"></script>
  </head>
  <body>
    <main id="gate" class="gate-shell">
      <section class="gate-card" aria-labelledby="page-title">
        <a class="wordmark" href="https://professional-software.com/" aria-label="Professional Software, inicio">
          <span class="wordmark-mark" aria-hidden="true">P</span>
          <span>Professional<br>Software</span>
        </a>

        <div class="gate-copy">
          <p class="eyebrow">Acceso privado</p>
          <h1 id="page-title">Informe privado</h1>
          <p class="intro">Introduce la contraseña que recibiste para consultar el informe y sus archivos.</p>
        </div>

        <form id="unlock-form" class="unlock-form" method="post" action="#">
          <label for="password">Contraseña</label>
          <div class="password-wrap">
            <input
              id="password"
              accesskey="p"
              type="password"
              required
              maxlength="256"
              autocomplete="current-password"
              autocapitalize="off"
              spellcheck="false"
              aria-describedby="password-hint status"
            >
            <button id="toggle-password" class="visibility-toggle" type="button" aria-pressed="false" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
          <p id="password-hint" class="field-hint">La contraseña distingue entre mayúsculas y minúsculas.</p>
          <button id="unlock-button" class="unlock-button" type="submit" disabled>Abrir informe</button>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </form>

        <noscript>
          <p class="no-script">Activa JavaScript en el navegador para abrir este informe de forma segura.</p>
        </noscript>

        <p class="privacy-note"><span class="privacy-dot" aria-hidden="true"></span>Acceso protegido</p>
      </section>
      <footer class="gate-footer">Professional Software <span aria-hidden="true">·</span> Acceso privado</footer>
    </main>

    <div id="workspace" class="workspace" hidden>
      <header id="toolbar" class="toolbar">
        <a class="toolbar-brand" href="https://professional-software.com/">
          <span class="toolbar-mark" aria-hidden="true">P</span>
          <span>Professional Software</span>
        </a>
        <nav class="toolbar-actions" aria-label="Acciones del informe">
          <a id="download-all" class="download-action" href="#">Descargar todo</a>
          <button id="lock-button" class="lock-action" type="button">Cerrar informe</button>
        </nav>
      </header>
      <div id="viewer-host" class="viewer-host"></div>
    </div>
  </body>
</html>
